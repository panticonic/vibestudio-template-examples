defaultAgentConfig:
  model: openai-codex:gpt-6.1-sol
initPanels:
  - source: panels/welcome
services:
  - source: workers/images
    name: images
  - source: workers/regency-realm
    name: regency
  - source: workers/grimoire-world
    name: grimoire
  - source: workers/adventure-world
    name: adventure
singletonObjects:
  - className: ImagesDO
    key: workspace-images
    source: workers/images
systemEpoch: 0
template:
  dependencies:
    - url: git+https://github.com/panticonic/vibestudio-base.git
  description: Agent-driven playable worlds, from Grimoire and Regency to three illustrated adventures sharing a programmable world engine, independent characters, a world builder and a reference-based scene artist.
  name: Examples

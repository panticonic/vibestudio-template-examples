systemEpoch: 0
templates:
  use:
    - url: git+https://github.com/panticonic/vibestudio-workspace-base.git
# No singletonObjects row: the service is a factory, and every caller names
# the game it means (`workers.resolveService("examples.regency.v1", gameKey)`),
# so two Regencies can live in one workspace. The panel's `gameKey` state arg
# and each seat's config carry that key.
services:
  - source: workers/regency-realm
    name: regency
    title: Regency game
    action: read and change the state of a Regency game
    description: Holds the world, orders and season clock of the Regency strategy game so its panel and agents share one truth.
    notability: everyday
    presentation:
      domain: automation
      verb: manage
    protocols:
      - examples.regency.v1
    authority:
      principals:
        - user
        - code
      binding:
        declaredFor:
          - panels/regency
          - workers/regency-agents
    durableObject:
      className: RegencyGameDO

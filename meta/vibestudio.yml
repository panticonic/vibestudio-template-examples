defaultAgentConfig:
  model: openai-codex:gpt-6.1-sol
initPanels:
  - source: panels/welcome
services:
  - name: regency
    source: workers/regency-realm
  - name: grimoire
    source: workers/grimoire-world
  - name: adventure
    source: workers/adventure-world
systemEpoch: 0
template:
  dependencies:
    - url: git+https://github.com/panticonic/vibestudio-base.git
  description: Agent-driven playable worlds, from Grimoire and Regency to three
    illustrated adventures sharing a programmable world engine, independent
    characters, a world builder and a reference-based scene artist.
  name: Examples

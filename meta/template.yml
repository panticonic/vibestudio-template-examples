systemEpoch: 0
template:
  name: Examples
  description: Agent-driven playable examples. Grimoire is an enchanted garden that answers your wishes; Regency is a conversational strategy game where independent advisors author executable policy for a living realm.
  repositories:
    - packages/living-canvas
    - packages/game-play-tests
    - packages/grimoire-engine
    - packages/regency-engine
    - panels/grimoire
    - panels/hello-svelte
    - panels/hello-vanilla
    - panels/regency
    - workers/grimoire-agents
    - workers/grimoire-world
    - workers/hello
    - workers/regency-agents
    - workers/regency-realm
    - workers/sample-do
  files: []
templates:
  use:
    - url: git+https://github.com/panticonic/vibestudio-workspace-base.git
# These services are factories rather than singletons. Every caller supplies
# the game or estate key it means, so multiple instances can coexist.
services:
  - source: workers/regency-realm
    name: regency
    title: Regency game
    action: read and change the state of a Regency game
    description: Holds the realm, advisor memories, executable policies and observed consequences behind Regency’s living illustration.
    notability: everyday
    presentation:
      domain: automation
      verb: manage
    protocols:
      - examples.regency.v1
    authority:
      principals:
        - host
        - user
        - code
      binding:
        declaredFor:
          - panels/regency
          - workers/regency-agents
    durableObject:
      className: RegencyGameDO
  - source: workers/grimoire-world
    name: grimoire
    title: Grimoire estate
    action: read and change the state of a Grimoire estate
    description: Holds the enchanted garden, wishes and their visible consequences so Moth and the player share one truth.
    notability: everyday
    presentation:
      domain: automation
      verb: manage
    protocols:
      - examples.grimoire.v1
    authority:
      principals:
        - host
        - user
        - code
      binding:
        declaredFor:
          - panels/grimoire
          - workers/grimoire-agents
    durableObject:
      className: GrimoireWorldDO
